name: weatherwise_flutter
description: WeatherWise - Cross-platform weather app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Maps
  flutter_map: ^6.1.0
  flutter_map_cancellable_tile_provider: ^2.0.0
  latlong2: ^0.9.0

  # Location
  geolocator: ^10.1.0

  # Storage
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Routing
  go_router: ^14.6.2

  # URL strategy (path-based, no #)
  url_strategy: ^0.3.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  logger: ^2.2.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

# Force older geolocator_android that uses hardcoded compileSdk (no flutter extension)
# Required because geolocator_android 4.6+ uses `flutter.compileSdkVersion` property
# which is only available in Flutter 3.27+. We use Flutter 3.24.4.
dependency_overrides:
  geolocator_android: 4.5.5

flutter:
  uses-material-design: true
  assets:
    - assets/env.config
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
