language: android
jdk: openjdk17

android:
  components:
    - tools
    - platform-tools
    - build-tools-35.0.0
    - android-35
    - extra-android-m2repository

before_script:
  # Berikan izin eksekusi pada gradlew
  - chmod +x gradlew

script:
  # 1. Build Debug APK
  - ./gradlew assembleDebug --no-daemon
  # 2. Build Release APK (untuk memvalidasi aturan ProGuard/R8)
  - ./gradlew assembleRelease --no-daemon

after_script:
  # Debug: Tampilkan file APK yang dihasilkan untuk memastikan path-nya benar
  - echo "=== Debug APK ==="
  - ls -la app/build/outputs/apk/debug/ || true
  - echo "=== Release APK ==="
  - ls -la app/build/outputs/apk/release/ || true

# ==============================================================================
# UPLOAD KE GITHUB RELEASES
# ==============================================================================
# Membutuhkan Environment Variable 'GITHUB_TOKEN' di pengaturan Travis CI
# dengan izin 'Contents: Read and write' pada Fine-Grained PAT.
deploy:
  provider: releases
  token: $GITHUB_TOKEN
  file:
    - app/build/outputs/apk/debug/app-debug.apk
    - app/build/outputs/apk/release/app-release-unsigned.apk
  skip_cleanup: true
  on:
    branch: android-stable
