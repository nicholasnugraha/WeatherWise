language: android
dist: jammy
jdk: openjdk17

env:
  global:
    - ANDROID_API_LEVEL=34
    - ANDROID_BUILD_TOOLS_VERSION=34.0.0
    - FLUTTER_VERSION="3.24.4"

android:
  components:
    - tools
    - platform-tools
    - build-tools-$ANDROID_BUILD_TOOLS_VERSION
    - android-$ANDROID_API_LEVEL
    - extra-google-m2repository
    - extra-android-m2repository

before_install:
  - git clone https://github.com/flutter/flutter.git -b $FLUTTER_VERSION --depth 1 $HOME/flutter
  - export PATH="$HOME/flutter/bin:$PATH"
  - flutter precache
  - flutter doctor

install:
  - travis_wait 30 flutter pub get
  # Inject the API key from the secure Travis env var WEATHER_API_KEY into
  # assets/.env right before build_runner. If the env var is empty, the
  # placeholder in assets/.env (committed in git) is used.
  - |
    if [ -n "$WEATHER_API_KEY" ]; then
      echo "WEATHER_API_KEY=$WEATHER_API_KEY" > /tmp/weatherwise_flutter/assets/.env
      echo "Wrote API key from Travis env into assets/.env"
    else
      echo "WEATHER_API_KEY env var not set; using whatever is in assets/.env"
    fi
  # Safety net: patch any plugin that still references flutter.compileSdkVersion
  # in case dependency_overrides didn't catch it. Injects compileSdk via sed.
  - |
    for gradle in $(find $HOME/.pub-cache/hosted/pub.dev -path "*/android/build.gradle" 2>/dev/null); do
      if grep -q "flutter\.compileSdkVersion" "$gradle" 2>/dev/null; then
        echo "Patching $gradle"
        sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 34/g; s/minSdkVersion flutter\.minSdkVersion/minSdkVersion 21/g' "$gradle"
      fi
    done
  - travis_wait 30 dart run build_runner build --delete-conflicting-outputs

script:
  # analyze with non-fatal flags (warnings don't fail the build)
  - flutter analyze --no-fatal-infos --no-fatal-warnings || echo "analyze warnings ignored"
  - travis_wait 30 flutter build apk --release

deploy:
  provider: releases
  token: $GITHUB_TOKEN
  file:
    - build/app/outputs/flutter-apk/app-release.apk
  skip_cleanup: true
  name: "WeatherWise Flutter Build $TRAVIS_BUILD_NUMBER"
  body: "Automated build from branch $TRAVIS_BRANCH (commit $TRAVIS_COMMIT)"
  tag_name: "flutter-build-$TRAVIS_BUILD_NUMBER"
  target_commitish: "$TRAVIS_COMMIT"
  prerelease: true
  overwrite: true
  on:
    branch: flutter

after_script:
  - echo "Build completed at $(date)"
  - ls -la build/app/outputs/flutter-apk/ || true
